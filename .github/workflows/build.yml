name: Build Release APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare SDK
        run: |
          echo sdk.dir=$ANDROID_HOME > local.properties
          echo no | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" || true
      - name: Calculate Version
        id: version
        run: |
          COUNT=${GITHUB_RUN_NUMBER}
          MAJOR=$((COUNT / 100))
          MINOR=$(((COUNT % 100) / 10))
          PATCH=$((COUNT % 10))
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          echo "vName=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "vCode=$COUNT" >> $GITHUB_OUTPUT
      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PvCode=${{ steps.version.outputs.vCode }} -PvName=${{ steps.version.outputs.vName }}
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/shq-${{ steps.version.outputs.vName }}.apk
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.vName }}
          name: shq v${{ steps.version.outputs.vName }}
          files: out/*.apk
      - name: Update raw files
        run: |
          mkdir -p release
          cp out/shq-${{ steps.version.outputs.vName }}.apk release/latest.apk
          echo '{"version":"${{ steps.version.outputs.vName }}"}' > release/version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/latest.apk release/version.json
          git commit -m "chore: update latest apk and version [skip ci]" || true
          git push || true

name: Build Release APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'release/**'
# 发布顺序执行；连续推送时仅保留最新的待运行任务，不中断已开始的发布。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Prepare SDK
        run: |
          echo sdk.dir=$ANDROID_HOME > local.properties
          echo no | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" || true
      - name: Restore signing key
        # 密钥不再提交到仓库。在 Settings > Secrets 配置 WEI_STORE_FILE_B64（keystore 的 base64）
        # 以及 WEI_STORE_PASSWORD / WEI_KEY_ALIAS / WEI_KEY_PASSWORD。
        # 未配置时构建照常进行，只是回退到 debug 签名。
        env:
          WEI_STORE_FILE_B64: ${{ secrets.WEI_STORE_FILE_B64 }}
        run: |
          if [ -n "$WEI_STORE_FILE_B64" ]; then
            echo "$WEI_STORE_FILE_B64" | base64 -d > "$RUNNER_TEMP/wei-release.jks"
            echo "WEI_STORE_FILE=$RUNNER_TEMP/wei-release.jks" >> $GITHUB_ENV
            echo "签名密钥已从 Secrets 恢复"
          else
            echo "未配置 WEI_STORE_FILE_B64，本次使用 debug 签名"
          fi
      - name: Calculate Version
        id: version
        run: |
          COUNT=${GITHUB_RUN_NUMBER}
          MAJOR=$((COUNT / 100))
          MINOR=$(((COUNT % 100) / 10))
          PATCH=$((COUNT % 10))
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          echo "vName=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "vCode=$COUNT" >> $GITHUB_OUTPUT
      - name: Build release
        env:
          WEI_STORE_PASSWORD: ${{ secrets.WEI_STORE_PASSWORD }}
          WEI_KEY_ALIAS: ${{ secrets.WEI_KEY_ALIAS }}
          WEI_KEY_PASSWORD: ${{ secrets.WEI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --build-cache --parallel --stacktrace -PvCode=${{ steps.version.outputs.vCode }} -PvName=${{ steps.version.outputs.vName }}
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/shq-${{ steps.version.outputs.vName }}.apk
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.vName }}
          name: shq v${{ steps.version.outputs.vName }}
          files: out/*.apk
      - name: Update raw files
        run: |
          mkdir -p release
          cp out/shq-${{ steps.version.outputs.vName }}.apk release/latest.apk
          echo '{"version":"${{ steps.version.outputs.vName }}"}' > release/version.json
          # 生成给 App 用的版本清单：App 从 CDN/raw 拉这份，不直接打 api.github.com
          curl -s -m 30 -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=30" > /tmp/releases.json || true
          python3 - <<'PY'
          import json
          try:
              data = json.load(open('/tmp/releases.json', encoding='utf-8'))
          except Exception:
              data = []
          out = []
          for r in data:
              if r.get('draft') or r.get('prerelease'):
                  continue
              apk = next((a for a in r.get('assets', []) if a.get('name', '').endswith('.apk')), None)
              if not apk:
                  continue
              out.append({
                  'v': (r.get('tag_name') or '').lstrip('v'),
                  't': r.get('name') or '',
                  'u': apk.get('browser_download_url', ''),
                  's': apk.get('size', 0),
              })
          json.dump({'updates': out}, open('release/updates.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print('updates:', len(out))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/latest.apk release/version.json release/updates.json
          git commit -m "chore: update latest apk and version [skip ci]" || true
          git push || true

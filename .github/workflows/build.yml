name: Build Release APK

# 构建加速与告警清理
#   1) fetch-depth: 1        —— 不拉全历史（仓库 .git 已 49MB）
#   2) setup-gradle v4        —— 缓存跨 run 复用；v3 在 Gradle 9 下频繁保存失败
#   3) concurrency            —— 连推多个 commit 时自动取消旧 run
#   4) 不再把 APK 提交进 git  —— 每次 5.4MB 永久写进历史
#   5) 显式 ubuntu-24.04      —— 避免 ubuntu-latest 标签迁移带来的环境漂移
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 不用 ubuntu-latest：官方已公告 latest 会迁移到 24.04/26.04，
    # 用固定版本，构建环境不会某天突然变样。
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # v5 起运行在 node24，v4 用的 node20 已被 GitHub 标记弃用
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 同理：setup-java v4 的 node20 已弃用，v5 迁到 node24
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # v4 修掉了 v3 在 Gradle 9 下的缓存保存失败问题
      # （之前报「未能保存路径 /home/runner/.gradle/caches/transforms-4/*」等）
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # 构建缓存写入；Gradle Home 缓存只在没有可用条目时写，减少无谓上传
          cache-read-only: false
          # 自动清理无用条目，避免缓存无限膨胀导致保存被拒
          gradle-home-cache-cleanup: true
          # 缓存内容真的变了才覆盖，避免每次 run 都重传几十 MB
          cache-overwrite-existing: true

      - name: Prepare SDK
        run: |
          echo sdk.dir=$ANDROID_HOME > local.properties
          # runner 自带部分组件，缺什么装什么，不无条件跑 sdkmanager
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | sdkmanager "platforms;android-36" > /dev/null 2>&1 || true
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sdkmanager "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - name: Restore signing key
        env:
          WEI_STORE_FILE_B64: ${{ secrets.WEI_STORE_FILE_B64 }}
        run: |
          if [ -n "$WEI_STORE_FILE_B64" ]; then
            echo "$WEI_STORE_FILE_B64" | base64 -d > "$RUNNER_TEMP/wei-release.jks"
            echo "WEI_STORE_FILE=$RUNNER_TEMP/wei-release.jks" >> $GITHUB_ENV
            echo "签名密钥已从 Secrets 恢复"
          else
            echo "未配置 WEI_STORE_FILE_B64，本次使用 debug 签名"
          fi

      - name: Calculate Version
        id: version
        run: |
          COUNT=${GITHUB_RUN_NUMBER}
          MAJOR=$((COUNT / 100))
          MINOR=$(((COUNT % 100) / 10))
          PATCH=$((COUNT % 10))
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          echo "vName=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "vCode=$COUNT" >> $GITHUB_OUTPUT

      - name: Build release
        env:
          WEI_STORE_PASSWORD: ${{ secrets.WEI_STORE_PASSWORD }}
          WEI_KEY_ALIAS: ${{ secrets.WEI_KEY_ALIAS }}
          WEI_KEY_PASSWORD: ${{ secrets.WEI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            --build-cache --parallel \
            -PvCode=${{ steps.version.outputs.vCode }} \
            -PvName=${{ steps.version.outputs.vName }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/shq-${{ steps.version.outputs.vName }}.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.vName }}
          name: shq v${{ steps.version.outputs.vName }}
          files: out/*.apk

      # 只提交版本号（20 字节）。APK 的唯一下载入口是 Release 附件，
      # App 内 UpdateChecker 走 releases API，不读 release/ 目录。
      - name: Update version marker
        run: |
          mkdir -p release
          echo '{"version":"${{ steps.version.outputs.vName }}"}' > release/version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/version.json
          if git diff --staged --quiet; then
            echo "版本号未变，跳过提交"
            exit 0
          fi
          git commit -m "chore: version ${{ steps.version.outputs.vName }} [skip ci]"
          git push || true

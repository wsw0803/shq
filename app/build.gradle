plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

/**
 * 签名配置。
 *
 * 优先级：
 *   1) Gradle 属性 -PweiStorePassword=... 等（或 ~/.gradle/gradle.properties）
 *   2) 环境变量（CI 用 GitHub Secrets 注入）
 *   3) 仓库内 wei-release.jks + 默认口令
 *
 * 第 3 条是为了保证 CI 直接出「可覆盖安装的正式包」。
 * 之前把密钥移出仓库后，CI 没有配置 Secrets，构建 fallback 到 debug 签名，
 * 结果产出的包签名不一致、无法覆盖旧版本安装。
 *
 * 迁移到 Secrets 的步骤：
 *   - Settings > Secrets 添加 WEI_STORE_FILE_B64 / WEI_STORE_PASSWORD /
 *     WEI_KEY_ALIAS / WEI_KEY_PASSWORD
 *   - workflow 里解码 B64 并 export WEI_STORE_FILE
 *   - 确认新包能覆盖安装后，再把 wei-release.jks 从仓库删除
 *   - 注意：旧密钥已经公开过，正式发布前应换新密钥（换新会导致无法覆盖安装旧版，需要用户卸载重装）
 */
def envOrProp = { String propName, String envName, String fallback ->
    if (project.hasProperty(propName)) return project.property(propName).toString()
    String v = System.getenv(envName)
    if (v != null && !v.isEmpty()) return v
    return fallback
}

android {
    namespace 'com.tencent.tim'
    compileSdk 36

    signingConfigs {
        release {
            storeFile file('../wei-release.jks')
            storePassword envOrProp('weiStorePassword', 'WEI_STORE_PASSWORD', 'wei123456')
            keyAlias envOrProp('weiKeyAlias', 'WEI_KEY_ALIAS', 'wei')
            keyPassword envOrProp('weiKeyPassword', 'WEI_KEY_PASSWORD', 'wei123456')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // 打开 v1/v2 签名，保证各版本 Android 都能正常安装
            signingConfig.enableV1Signing = true
            signingConfig.enableV2Signing = true
        }
    }

    defaultConfig {
        applicationId 'com.tencent.tim'
        minSdk 21
        targetSdk 34
        versionCode project.hasProperty("vCode") ? project.property("vCode").toInteger() : 1
        versionName project.hasProperty("vName") ? project.property("vName") : "1.0.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += ["DebugProbesKt.bin", "META-INF/AL2.0", "META-INF/LGPL2.1"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 经典 Xposed API —— 必须 compileOnly，绝不能打进 APK。
    //
    // 两次踩坑记录：
    //   1) 把 de.robv.android.xposed.* 桩类写进源码一起打包，LSPosed 报
    //        The Xposed API classes are compiled into the module's APK.
    //      直接拒绝加载。
    //   2) 换成 libxposed 新版 API，报
    //        ClassNotFoundException: io.github.libxposed.api.XposedModule
    //      因为本模块走的是经典加载路径（xposedmodule + assets/xposed_init），
    //      LSPosed 只会注入经典 API，跟 LSPosed 版本新旧无关。
    //
    // 所以：经典 API + compileOnly + 官方仓库，API 类不进 APK。
    // 这个 artifact 在 Maven Central / google() 都没有，只有 api.xposed.info 有。
    compileOnly 'de.robv.android.xposed:api:82'

    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout

    // DocumentFile 依赖
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

/**
 * 签名信息全部从外部注入，仓库里不再出现任何密钥或口令。
 *
 * 读取顺序：
 *   1) Gradle 属性：-PweiStoreFile=... -PweiStorePassword=...（或 ~/.gradle/gradle.properties）
 *   2) 环境变量：CI 用 GitHub Secrets 注入
 *   3) 都没有时退回 debug 签名，保证本地/CI 仍能出包
 *
 * 注意：debug 签名的包无法覆盖安装正式版，只能用于自测。
 *
 * GitHub Secrets 需要配置：
 *   WEI_STORE_FILE_B64   base64 -w0 <新的 keystore>
 *   WEI_STORE_PASSWORD   新口令
 *   WEI_KEY_ALIAS        别名
 *   WEI_KEY_PASSWORD     新口令
 * workflow 里先把 B64 解码成 ${'$'}RUNNER_TEMP/wei-release.jks，再 export WEI_STORE_FILE 指向它。
 */
def signProp = { String propName, String envName ->
    if (project.hasProperty(propName)) return project.property(propName).toString()
    String v = System.getenv(envName)
    return (v != null && !v.isEmpty()) ? v : null
}

def weiStoreFile = signProp('weiStoreFile', 'WEI_STORE_FILE')
def weiStorePassword = signProp('weiStorePassword', 'WEI_STORE_PASSWORD')
def weiKeyAlias = signProp('weiKeyAlias', 'WEI_KEY_ALIAS')
def weiKeyPassword = signProp('weiKeyPassword', 'WEI_KEY_PASSWORD')

android {
    namespace 'com.tencent.tim'
    compileSdk 36

    signingConfigs {
        if (weiStoreFile != null && weiStorePassword != null
                && weiKeyAlias != null && weiKeyPassword != null
                && file(weiStoreFile).exists()) {
            release {
                storeFile file(weiStoreFile)
                storePassword weiStorePassword
                keyAlias weiKeyAlias
                keyPassword weiKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // 有完整的外部签名配置才用 release 签名，否则退回 debug，避免构建直接失败
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    defaultConfig {
        applicationId 'com.tencent.tim'
        minSdk 21
        targetSdk 34
        versionCode project.hasProperty("vCode") ? project.property("vCode").toInteger() : 1
        versionName project.hasProperty("vName") ? project.property("vName") : "1.0.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += ["DebugProbesKt.bin", "META-INF/AL2.0", "META-INF/LGPL2.1"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout

    // DocumentFile 依赖
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

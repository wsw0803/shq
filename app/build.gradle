plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.tencent.tim'
    compileSdk 36

    signingConfigs {
        release {
            storeFile file("../wei-release.jks")
            storePassword "wei123456"
            keyAlias "wei"
            keyPassword "wei123456"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    defaultConfig {
        applicationId 'com.tencent.tim'
        minSdk 21
        targetSdk 34
        versionCode project.hasProperty("vCode") ? project.property("vCode").toInteger() : 1
        versionName project.hasProperty("vName") ? project.property("vName") : "1.0.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    
    // DocumentFile 依赖
    implementation 'androidx.documentfile:documentfile:1.0.1'
}